[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghmvae"
version = "0.1.0"
description = "Research code for VAE clustering with flexible mixture priors."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24,<1.26",
  "tomli>=2.0; python_version < '3.11'",
  "torch>=2.2",
]

[project.optional-dependencies]
fmvmm = [
  "conorm~=1.2.0",
  "matplotlib~=3.7",
  "pandas>=2.0,<2.2",
  "scikit-learn>=1.6,<1.8",
  "scipy>=1.9,<1.11",
]
dev = [
  "pytest>=8.0",
]
vision = [
  "torchvision>=0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
